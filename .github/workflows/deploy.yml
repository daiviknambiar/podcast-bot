name: Deploy Alexa Hosted Skill

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SKILL_ID: amzn1.ask.skill.8731ea2f-6df5-4445-a307-582ff944ab13
      ASK_REFRESH_TOKEN: ${{ secrets.ASK_REFRESH_TOKEN }}
      ASK_VENDOR_ID: ${{ secrets.ASK_VENDOR_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Verify required secrets
        run: |
          missing=0
          if [ -z "$ASK_REFRESH_TOKEN" ]; then
            echo "::error title=Missing secret::ASK_REFRESH_TOKEN is required. See README for how to obtain it."
            missing=1
          fi
          if [ -z "$ASK_VENDOR_ID" ]; then
            echo "::error title=Missing secret::ASK_VENDOR_ID is required. See README for where to find it."
            missing=1
          fi
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::warning title=Optional secret missing::GEMINI_API_KEY not set; AskAboutIntent will not work until you add it."
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install ASK CLI and jq
        run: |
          npm i -g ask-cli@2
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Prepare Lambda dependencies
        working-directory: lambda
        run: npm install --omit=dev

      - name: Node syntax check
        run: node --check lambda/index.js

      - name: Create ASK CLI profile config (~/.ask/cli_config)
        env:
          ASK_REFRESH_TOKEN: ${{ secrets.ASK_REFRESH_TOKEN }}
          ASK_VENDOR_ID: ${{ secrets.ASK_VENDOR_ID }}
        run: |
          mkdir -p "${HOME}/.ask"
          node -e "const fs=require('fs');const p=require('path');const cfg={profiles:{default:{vendor_id:process.env.ASK_VENDOR_ID,token:{access_token:'',refresh_token:process.env.ASK_REFRESH_TOKEN,token_type:'bearer',expires_in:0,expires_at:'1970-01-01T00:00:00.000Z'},code:{default:{src:'lambda'}},skillMetadata:{src:'skill-package'},skillInfrastructure:{type:'@ask-cli/hosted-skill-deployer'}}}};fs.writeFileSync(p.join(process.env.HOME,'.ask','cli_config'),JSON.stringify(cfg));"
          echo "ASK profile written."

      - name: Validate ASK connectivity (get skill status)
        run: |
          ask smapi get-skill-status -s "$SKILL_ID" --profile default >/dev/null 2>&1 || { echo "::error title=ASK CLI auth failed::Ensure ASK_REFRESH_TOKEN and ASK_VENDOR_ID are valid for skill $SKILL_ID."; exit 1; }
          echo "ASK connectivity OK."

      - name: Configure Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Prepare CI-only branch with Gemini key (not pushed to GitHub)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          DEP_BRANCH="ci/alexa-deploy-${GITHUB_SHA}"
          git checkout -b "$DEP_BRANCH"
          if [ -n "$GEMINI_API_KEY" ]; then
            node -e "const fs=require('fs');const k=process.env.GEMINI_API_KEY||'';const v='module.exports = { GEMINI_API_KEY: \\''+k.replace(/'/g,\"\\\\'\")+'\\' };';fs.writeFileSync('lambda/gemini-key.js',v);"
            git add -f lambda/gemini-key.js
            git commit -m "ci: add gemini key for hosted deploy (CI-only)"
          fi

      - name: Resolve Alexa Hosted repository URL
        id: hosted
        run: |
          REPO_URL="$(ask smapi get-alexa-hosted-skill-metadata -s "$SKILL_ID" --profile default | jq -r '.alexaHosted.repository.url')"
          if [ -z "$REPO_URL" ] || [ "$REPO_URL" = "null" ]; then
            echo "::error title=Hosted repo not found::Could not obtain Alexa Hosted repository URL for $SKILL_ID."
            exit 1
          fi
          echo "repo_url=$REPO_URL" >> "$GITHUB_OUTPUT"
          echo "Hosted repo URL resolved."

      - name: Configure Git credential helper for ASK
        run: |
          git config --global credential.helper '!ask util git-credentials-helper'

      - name: Push to Alexa Hosted via helper
        id: push_helper
        continue-on-error: true
        env:
          REPO_URL: ${{ steps.hosted.outputs.repo_url }}
        run: |
          git remote add alexa "$REPO_URL" || git remote set-url alexa "$REPO_URL"
          GIT_TRACE=0 git push --force alexa HEAD:master

      - name: Fallback push via credential-store
        id: push_fallback
        if: steps.push_helper.outcome == 'failure'
        env:
          REPO_URL: ${{ steps.hosted.outputs.repo_url }}
        run: |
          # Generate short-lived credentials
          CREDS_JSON="$(ask smapi generate-credentials-for-alexa-hosted-skill -s "$SKILL_ID" --repository-url "$REPO_URL" --repository-type GIT --profile default)"
          USERNAME="$(printf "%s" "$CREDS_JSON" | jq -r '..|.username? // .userName? // empty' | head -n1)"
          PASSWORD="$(printf "%s" "$CREDS_JSON" | jq -r '..|.password? // .pass? // empty' | head -n1)"
          if [ -z "$USERNAME" ] || [ -z "$PASSWORD" ]; then
            echo "::error title=Hosted credentials error::Could not parse username/password from SMAPI response."
            exit 1
          fi
          echo "::add-mask::$USERNAME"
          echo "::add-mask::$PASSWORD"
          # Build credential-store file scoped to this host/path
          CRED_FILE="$(mktemp)"
          {
            echo "url=$REPO_URL"
            echo "username=$USERNAME"
            echo "password=$PASSWORD"
          } | git -c credential.helper="store --file $CRED_FILE" credential-store store
          # Push using only this temporary credential store (override global helper)
          if ! GIT_TRACE=0 git -c credential.helper= -c credential.helper="store --file $CRED_FILE" push --force alexa HEAD:master; then
            # Second-chance: use Authorization header inline without printing secrets
            BASIC="$(printf "%s:%s" "$USERNAME" "$PASSWORD" | base64 | tr -d '\n')"
            echo "::add-mask::$BASIC"
            GIT_TRACE=0 git -c credential.helper= -c http."$REPO_URL".extraHeader="Authorization: Basic $BASIC" push --force alexa HEAD:master
          fi

      - name: Update manifest via SMAPI (development)
        if: steps.push_helper.outcome == 'success' || steps.push_fallback.outcome == 'success'
        continue-on-error: true
        run: |
          ask smapi update-skill-manifest -s "$SKILL_ID" --stage development --manifest file:skill-package/skill.json --profile default

      - name: Update interaction model via SMAPI (en-US)
        if: steps.push_helper.outcome == 'success' || steps.push_fallback.outcome == 'success'
        run: |
          ask smapi set-interaction-model -s "$SKILL_ID" --stage development --locale en-US --interaction-model file:skill-package/interactionModels/custom/en-US.json --profile default

      - name: Poll interaction model build to succeed
        if: steps.push_helper.outcome == 'success' || steps.push_fallback.outcome == 'success'
        run: |
          n=0
          until [ $n -ge 24 ]; do
            STATUS_JSON="$(ask smapi get-skill-status -s "$SKILL_ID" --profile default)"
            echo "$STATUS_JSON" | jq -r '.manifest.lastUpdateRequest.status?, .interactionModel.custom["en-US"].lastUpdateRequest.status?' | paste - -
            MODEL_STATUS="$(echo "$STATUS_JSON" | jq -r '.interactionModel.custom["en-US"].lastUpdateRequest.status?')"
            if [ "$MODEL_STATUS" = "SUCCEEDED" ]; then
              echo "Interaction model build SUCCEEDED."
              exit 0
            fi
            if [ "$MODEL_STATUS" = "FAILED" ]; then
              echo "::error title=Interaction model build failed::$(echo "$STATUS_JSON" | jq -r '.interactionModel.custom["en-US"].lastUpdateRequest.errors? // empty')"
              exit 1
            fi
            n=$((n+1))
            sleep 5
          done
          echo "::error title=Timeout waiting for interaction model build::No SUCCEEDED within timeout."
          exit 1

