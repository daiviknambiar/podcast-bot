name: Deploy Alexa Hosted Skill (clean)

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SKILL_ID: amzn1.ask.skill.8731ea2f-6df5-4445-a307-582ff944ab13
      ASK_REFRESH_TOKEN: ${{ secrets.ASK_REFRESH_TOKEN }}
      ASK_VENDOR_ID: ${{ secrets.ASK_VENDOR_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install ASK CLI and jq
        run: |
          npm i -g ask-cli@2
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Prepare Lambda dependencies
        working-directory: lambda
        run: npm install --omit=dev

      - name: Node syntax check
        run: node --check lambda/index.js

      - name: Create ASK CLI profile config (~/.ask/cli_config)
        env:
          ASK_REFRESH_TOKEN: ${{ secrets.ASK_REFRESH_TOKEN }}
          ASK_VENDOR_ID: ${{ secrets.ASK_VENDOR_ID }}
        run: |
          mkdir -p "${HOME}/.ask"
          node -e "const fs=require('fs');const p=require('path');const cfg={profiles:{default:{vendor_id:process.env.ASK_VENDOR_ID,token:{access_token:'',refresh_token:process.env.ASK_REFRESH_TOKEN,token_type:'bearer',expires_in:0,expires_at:'1970-01-01T00:00:00.000Z'},code:{default:{src:'lambda'}},skillMetadata:{src:'skill-package'},skillInfrastructure:{type:'@ask-cli/hosted-skill-deployer'}}}};fs.writeFileSync(p.join(process.env.HOME,'.ask','cli_config'),JSON.stringify(cfg));"
          echo "ASK profile written."

      - name: Validate ASK connectivity (get skill status)
        run: |
          ask smapi get-skill-status -s "$SKILL_ID" --profile default >/dev/null 2>&1 || { echo "::error title=ASK CLI auth failed::Check ASK_REFRESH_TOKEN and ASK_VENDOR_ID."; exit 1; }
          echo "ASK connectivity OK."

      - name: Resolve Alexa Hosted repository URL
        id: hosted
        run: |
          ATTEMPTS=0
          REPO_URL=""
          until [ $ATTEMPTS -ge 3 ]; do
            REPO_URL="$(ask smapi get-alexa-hosted-skill-metadata -s "$SKILL_ID" --profile default | jq -r '.alexaHosted.repository.url')"
            if [ -n "$REPO_URL" ] && [ "$REPO_URL" != "null" ]; then break; fi
            ATTEMPTS=$((ATTEMPTS+1))
            sleep $((2*ATTEMPTS))
          done
          if [ -z "$REPO_URL" ] || [ "$REPO_URL" = "null" ]; then
            echo "::error title=Hosted repo not found::Could not obtain Alexa Hosted repository URL for $SKILL_ID."
            exit 1
          fi
          echo "repo_url=$REPO_URL" >> "$GITHUB_OUTPUT"
          echo "Hosted repo URL resolved."

      - name: Configure Git credential helper for ASK
        run: git config --global credential.helper '!ask util git-credentials-helper'

      - name: Configure Git user (for throwaway commit)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: "Write lambda/gemini-key.js (throwaway deploy commit)"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PODBOT_WEBHOOK_URL: ${{ secrets.PODBOT_WEBHOOK_URL }}
          PODBOT_WEBHOOK_KEY: ${{ secrets.PODBOT_WEBHOOK_KEY }}
          PODBOT_AUTH_HEADER: ${{ secrets.PODBOT_AUTH_HEADER }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const trim = (v) => String(v || '').trim().replace(/^['"]|['"]$/g, '');
          const data = {
            GEMINI_API_KEY: trim(process.env.GEMINI_API_KEY),
            OPENAI_API_KEY: trim(process.env.OPENAI_API_KEY),
            PODBOT_WEBHOOK_URL: trim(process.env.PODBOT_WEBHOOK_URL),
            PODBOT_WEBHOOK_KEY: trim(process.env.PODBOT_WEBHOOK_KEY),
            PODBOT_AUTH_HEADER: trim(process.env.PODBOT_AUTH_HEADER || 'Authorization'),
          };
          const lines = ['module.exports = {'];
          for (const [k, v] of Object.entries(data)) {
            lines.push(`  ${k}: ${JSON.stringify(v)},`);
          }
          lines.push('};');
          fs.mkdirSync('lambda', { recursive: true });
          fs.writeFileSync('lambda/gemini-key.js', lines.join('\n'));
          const lens = Object.fromEntries(Object.entries(data).map(([k, v]) => [k, String(v || '').length]));
          console.log(Object.entries(lens).map(([k, v]) => `${k}=${v}`).join(' '));
          NODE
          git add -f lambda/gemini-key.js
          git commit -m "deploy: inject runtime secrets [throwaway]"

      - name: "Validate written key lengths (fail if GEMINI_API_KEY empty)"
        run: |
          node - <<'NODE'
          const m = require('./lambda/gemini-key.js');
          const lens = Object.fromEntries(Object.entries(m).map(([k, v]) => [k, String(v || '').length]));
          console.log(Object.entries(lens).map(([k, v]) => `${k}=${v}`).join(' '));
          if (!m.GEMINI_API_KEY || String(m.GEMINI_API_KEY).length === 0) {
            process.exitCode = 2;
          }
          NODE

      - name: "List repository secrets (names only)"
        continue-on-error: true
        run: |
          if command -v gh >/dev/null 2>&1; then
            echo "Secrets (repo scope):"
            gh secret list | awk '{print $1}' | sort
          else
            echo "gh not available; skipping secret name listing."
          fi

      - name: Push to Alexa Hosted via helper
        id: push_helper
        continue-on-error: true
        env:
          REPO_URL: ${{ steps.hosted.outputs.repo_url }}
        run: |
          git remote add alexa "$REPO_URL" || git remote set-url alexa "$REPO_URL"
          set -e
          echo "Pushing to CodeCommit master..."
          GIT_TRACE=0 git push --force alexa HEAD:master
          echo "Pushing to CodeCommit dev..."
          GIT_TRACE=0 git push --force alexa HEAD:dev

      - name: Fallback push via generated credentials
        id: push_fallback
        if: steps.push_helper.outcome == 'failure'
        continue-on-error: true
        env:
          REPO_URL: ${{ steps.hosted.outputs.repo_url }}
        run: |
          CREDS_JSON="$(ask smapi generate-credentials-for-alexa-hosted-skill -s "$SKILL_ID" --repository-url "$REPO_URL" --repository-type GIT --profile default || true)"
          USERNAME="$(printf "%s" "$CREDS_JSON" | jq -r '..|.username? // .userName? // empty' | head -n1)"
          PASSWORD="$(printf "%s" "$CREDS_JSON" | jq -r '..|.password? // .pass? // empty' | head -n1)"
          if [ -z "$USERNAME" ] || [ -z "$PASSWORD" ]; then
            echo "::error title=Hosted credentials error::Could not parse credentials."
            exit 1
          fi
          echo "::add-mask::$USERNAME"
          echo "::add-mask::$PASSWORD"
          BASIC="$(printf "%s:%s" "$USERNAME" "$PASSWORD" | base64 | tr -d '\n')"
          GIT_TRACE=0 git -c credential.helper= -c http."$REPO_URL".extraHeader="Authorization: Basic $BASIC" push --force alexa HEAD:master
          GIT_TRACE=0 git -c credential.helper= -c http."$REPO_URL".extraHeader="Authorization: Basic $BASIC" push --force alexa HEAD:dev

      - name: Verify CodeCommit dev and grep PlayPodcast fix
        if: steps.push_helper.outcome == 'success' || steps.push_fallback.outcome == 'success'
        env:
          REPO_URL: ${{ steps.hosted.outputs.repo_url }}
        run: |
          CREDS_JSON="$(ask smapi generate-credentials-for-alexa-hosted-skill -s "$SKILL_ID" --repository-url "$REPO_URL" --repository-type GIT --profile default || true)"
          USERNAME="$(printf "%s" "$CREDS_JSON" | jq -r '..|.username? // .userName? // empty' | head -n1)"
          PASSWORD="$(printf "%s" "$CREDS_JSON" | jq -r '..|.password? // .pass? // empty' | head -n1)"
          echo "::add-mask::$USERNAME"
          echo "::add-mask::$PASSWORD"
          BASIC="$(printf "%s:%s" "$USERNAME" "$PASSWORD" | base64 | tr -d '\n')"
          echo "::add-mask::$BASIC"
          rm -rf alexa-verify
          git -c credential.helper= -c http."$REPO_URL".extraHeader="Authorization: Basic $BASIC" clone "$REPO_URL" alexa-verify
          cd alexa-verify
          git -c credential.helper= -c http."$REPO_URL".extraHeader="Authorization: Basic $BASIC" fetch origin
          echo "origin/dev    HEAD: $(git log -1 --format=%H origin/dev || true)"
          echo "PlayPodcast fix (grep) in origin/dev lambda/index.js:"
          git show origin/dev:lambda/index.js | grep -n 'PlayPodcast resolved:' || true
          echo "Key file check on origin/dev:"
          if git show origin/dev:lambda/gemini-key.js >/tmp/gemini-key.js 2>/dev/null; then
            echo "lambda/gemini-key.js: present"
            LEN=$(node -e "const m=require('/tmp/gemini-key.js');const v=(m&&m.GEMINI_API_KEY)?String(m.GEMINI_API_KEY).trim():'';console.log(v.length);")
            echo "GEMINI_API_KEY length (dev): $LEN"
          else
            echo "lambda/gemini-key.js: missing"
          fi

      - name: Update interaction model (en-US) via SMAPI
        run: |
          echo "Submitting en-US interaction model..."
          ask smapi set-interaction-model \
            -s "$SKILL_ID" \
            -g development \
            -l en-US \
            --interaction-model "file:skill-package/interactionModels/custom/en-US.json" \
            --profile default

      - name: Wait for en-US model build to succeed
        run: |
          echo "Waiting for interaction model build (en-US)..."
          ATTEMPTS=0
          MAX_ATTEMPTS=30
          while :; do
            STATUS_JSON="$(ask smapi get-skill-status -s "$SKILL_ID" --profile default)"
            STATUS="$(printf "%s" "$STATUS_JSON" | jq -r '.interactionModel["en-US"].lastUpdateRequest.status // empty')"
            echo "Current status: ${STATUS:-unknown}"
            if [ "$STATUS" = "SUCCEEDED" ]; then
              echo "Interaction model build SUCCEEDED."
              break
            fi
            if [ "$STATUS" = "FAILED" ]; then
              echo "::error title=Interaction model build failed::$(printf "%s" "$STATUS_JSON" | jq -r '.interactionModel["en-US"].lastUpdateRequest.errors // [] | tostring')"
              exit 1
            fi
            ATTEMPTS=$((ATTEMPTS+1))
            if [ $ATTEMPTS -ge $MAX_ATTEMPTS ]; then
              echo "::error title=Interaction model build timeout::Did not reach SUCCEEDED after $((MAX_ATTEMPTS*5)) seconds."
              exit 1
            fi
            sleep 5
          done

      - name: Verify live model contains new intents
        run: |
          sleep 3
          MODEL_JSON="$(ask smapi get-interaction-model -s "$SKILL_ID" -g development -l en-US --profile default)"
          echo "$MODEL_JSON" | jq -r '.interactionModel.languageModel.intents[].name' | sort | uniq | sed 's/^/INTENT: /'
          for N in GeneralQueryIntent SkipForwardIntent SkipBackIntent ResumeAliasIntent; do
            if ! echo "$MODEL_JSON" | jq -r '.interactionModel.languageModel.intents[].name' | grep -qx "$N"; then
              echo "::error title=Intent missing::$N not found in live model"
              exit 1
            fi
          done

      - name: Gemini smoke test (no secrets in logs)
        run: |
          node - <<'NODE'
          const https = require('https');
          let key;
          try { key = require('./lambda/gemini-key.js').GEMINI_API_KEY; } catch {}
          if (!key || String(key).trim().length === 0) {
            console.log('GEMINI_SMOKE: key missing, skipping');
            process.exit(0);
          }
          const model = 'models/gemini-flash-lite-latest';
          const body = JSON.stringify({
            contents: [{ role: 'user', parts: [{ text: 'One-sentence test.' }] }],
            generationConfig: { maxOutputTokens: 16, temperature: 0.2 }
          });
          const modelName = model.startsWith('models/') ? model.slice(7) : model;
          const options = {
            protocol: 'https:',
            hostname: 'generativelanguage.googleapis.com',
            port: 443,
            path: '/v1beta/models/' + encodeURIComponent(modelName) + ':generateContent',
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Content-Length': Buffer.byteLength(body), 'x-goog-api-key': key }
          };
          const start = Date.now();
          const req = https.request(options, (res) => {
            const chunks = [];
            res.on('data', (d) => chunks.push(d));
            res.on('end', () => {
              const ms = Date.now() - start;
              const text = Buffer.concat(chunks).toString('utf8').slice(0, 120).replace(/\\s+/g,' ').trim();
              console.log(`GEMINI_SMOKE: model=${model} status=${res.statusCode} latencyMs=${ms} excerpt=${JSON.stringify(text)}`);
            });
          });
          req.setTimeout(3500, () => { req.destroy(new Error('timeout')); });
          req.on('error', (e) => {
            const ms = Date.now() - start;
            console.log(`GEMINI_SMOKE: model=${model} error=${JSON.stringify(e.message || String(e))} latencyMs=${ms}`);
          });
          req.end(body);
          NODE

      - name: Gemini grounded smoke (no secrets in logs)
        continue-on-error: true
        run: |
          node - <<'NODE'
          const https = require('https');
          let key;
          try { key = require('./lambda/gemini-key.js').GEMINI_API_KEY; } catch {}
          if (!key || String(key).trim().length === 0) {
            console.log('GEMINI_GROUNDED_SMOKE: key missing, skipping');
            process.exit(0);
          }
          const model = 'models/gemini-flash-lite-latest';
          const body = JSON.stringify({
            contents: [{ role: 'user', parts: [{ text: 'Who is the current CEO of SpaceX? One short sentence.' }] }],
            tools: [{ googleSearchRetrieval: {} }],
            generationConfig: { maxOutputTokens: 24, temperature: 0.2 }
          });
          const modelName = model.startsWith('models/') ? model.slice(7) : model;
          const options = {
            protocol: 'https:',
            hostname: 'generativelanguage.googleapis.com',
            port: 443,
            path: '/v1beta/models/' + encodeURIComponent(modelName) + ':generateContent',
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Content-Length': Buffer.byteLength(body), 'x-goog-api-key': key }
          };
          const start = Date.now();
          const req = https.request(options, (res) => {
            const chunks = [];
            res.on('data', (d) => chunks.push(d));
            res.on('end', () => {
              const ms = Date.now() - start;
              const text = Buffer.concat(chunks).toString('utf8').slice(0, 120).replace(/\\s+/g,' ').trim();
              console.log(`GEMINI_GROUNDED_SMOKE: model=${model} status=${res.statusCode} latencyMs=${ms} excerpt=${JSON.stringify(text)}`);
            });
          });
          req.setTimeout(3500, () => { req.destroy(new Error('timeout')); });
          req.on('error', (e) => {
            const ms = Date.now() - start;
            console.log(`GEMINI_GROUNDED_SMOKE: model=${model} error=${JSON.stringify(e.message || String(e))} latencyMs=${ms}`);
          });
          req.end(body);
          NODE

      - name: Answer smoke test (ungrounded, no secrets)
        run: |
          node - <<'NODE'
          let key;
          try { key = require('./lambda/gemini-key.js').GEMINI_API_KEY; } catch {}
          if (!key || String(key).trim().length === 0) {
            console.log('ANSWER_SMOKE: key missing, skipping');
            process.exit(0);
          }
          const skill = require('./lambda/index.js');
          const start = Date.now();
          const q = 'who is the CEO of Anthropic';
          Promise.resolve(skill._answerForSmoke(q)).then((txt) => {
            const ms = Date.now() - start;
            const t = String(txt || '').replace(/\\s+/g,' ').trim();
            if (!t || /took too long/i.test(t)) { console.log(`ANSWER_SMOKE: timeout-or-empty latencyMs=${ms} text=${JSON.stringify(t)}`); process.exit(1); }
            console.log(`ANSWER_SMOKE: ok latencyMs=${ms} text=${JSON.stringify(t.slice(0,120))}`);
          }).catch((e) => {
            const ms = Date.now() - start;
            console.log(`ANSWER_SMOKE: error latencyMs=${ms} err=${JSON.stringify(e && e.message || String(e))}`);
            process.exit(1);
          });
          NODE
